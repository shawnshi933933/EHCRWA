kind = "web"
previewPath = "/"
title = "EHC DEX"
description = "Stock-only RWA intelligence with a stock-to-issuer relationship map, source-attributed token data, contracts and issuer research. Market-pair access limitations are explicitly disclosed; no trading."
version = "1.0.0"
id = "artifacts/rwa-market"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19569

[services.development]
run = "pnpm --filter @workspace/rwa-market run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rwa-market", "run", "build" ]
serve = "static"
publicDir = "artifacts/rwa-market/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19569"
BASE_PATH = "/"
